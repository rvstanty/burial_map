{% extends "base.html" %}

{% block title %}Daftar Kematian{% endblock %}

{% block content %}
<style>
    .map-selection-container {
        background: #1c1c1c;
        border: 2px dashed #00ffcc;
        border-radius: 10px;
        padding: 15px;
    }

    .map-zoom-container {
        overflow: hidden; 
        position: relative;
        border: 1px solid #333;
        border-radius: 8px;
        background: #000;
        touch-action: none; 
    }

    .map-wrapper {
        position: relative;
        display: inline-block;
        transition: transform 0.1s ease-out; 
        transform-origin: 0 0;
        cursor: crosshair;
    }

    #mapImage {
        max-width: 100%;
        height: auto;
        display: block;
        min-height: 200px;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* Kursor */
    .can-pan { cursor: grab !important; }
    .panning { cursor: grabbing !important; }

    /* Layout Butang Zoom Kotak di Bawah Peta */
    .zoom-controls-bottom {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        padding: 5px;
    }

    .btn-zoom-box {
        width: 60px; /* Lebar kotak */
        height: 45px; /* Tinggi kotak */
        background: #00ffcc;
        color: #000;
        border: none;
        border-radius: 4px; /* Sedikit rounded di bucu kotak */
        font-weight: bold;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        transition: 0.2s;
    }

    .btn-zoom-box:active {
        transform: scale(0.95);
        background: #00cca3;
    }

    .btn-reset-box {
        background: #ff3e3e;
        color: white;
        width: 80px; /* Reset dibuat lebih lebar sedikit */
    }

    .map-option {
        cursor: pointer;
        border: 3px solid transparent;
        transition: 0.3s;
        border-radius: 5px;
        height: 60px;
        object-fit: cover;
        width: 100%;
    }

    .map-option.active {
        border-color: #00ffcc;
        transform: scale(1.05);
    }

    .text-cyan { color: #00ffcc; }
    
    /* Pin Style */
    .pin {
        position: absolute;
        width: 24px;
        height: 24px;
        background-color: #ff3e3e;
        border: 3px solid white;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        margin-left: -12px; 
        margin-top: -24px;  
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        pointer-events: none;
        display: none;
        z-index: 10;
    }

    .pin::after {
        content: "";
        width: 10px;
        height: 10px;
        margin: 4px 0 0 4px;
        background: #fff;
        position: absolute;
        border-radius: 50%;
    }
</style>

<div class="container mt-5 pt-5">
    <h1 class="text-center mb-4">Daftar Kematian</h1>

    <form method="post" action="{{ url_for('daftar_kematian') }}" class="mx-auto mb-5 px-3 py-4 bg-dark text-white rounded shadow-lg" style="max-width: 600px;">
        <div class="mb-3">
            <label for="deceased_name" class="form-label">Nama Si Mati</label>
            <input type="text" class="form-control" id="deceased_name" name="deceased_name" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="stone_number" class="form-label">Nombor Batu Nisan</label>
                <input type="text" class="form-control" id="stone_number" name="stone_number" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="date_of_birth" class="form-label">Tarikh Lahir</label>
                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="age_at_death" class="form-label">Umur Semasa Meninggal</label>
            <input type="number" class="form-control" id="age_at_death" name="age_at_death" min="0" required>
        </div>
        <div class="mb-3">
            <label for="heir_name" class="form-label">Nama Waris</label>
            <input type="text" class="form-control" id="heir_name" name="heir_name" required>
        </div>
        <div class="mb-3">
            <label for="heir_contact" class="form-label">Alamat & No. Telefon Waris</label>
            <textarea class="form-control" id="heir_contact" name="heir_contact" rows="2" required></textarea>
        </div>

        <div class="map-selection-container mb-4">
            <label class="form-label d-block text-center fw-bold text-cyan">Langkah 2: Tetapkan Lokasi Kubur</label>
            
            <div class="row g-2 mb-3 text-center">
                <div class="col-3">
                    <p class="small">Hadapan Kiri</p>
                    <img src="{{ url_for('static', filename='images/pinned/fleft.jpg') }}" class="img-fluid map-option active" onclick="changeMap(this, 'fleft')">
                </div>
                <div class="col-3">
                    <p class="small">Hadapan Kanan</p>
                    <img src="{{ url_for('static', filename='images/pinned/fright.jpg') }}" class="img-fluid map-option" onclick="changeMap(this, 'fright')">
                </div>
                <div class="col-3">
                    <p class="small">Belakang</p>
                    <img src="{{ url_for('static', filename='images/pinned/back.jpg') }}" class="img-fluid map-option" onclick="changeMap(this, 'back')">
                </div>
                <div class="col-3">
                    <p class="small">Tengah</p>
                    <img src="{{ url_for('static', filename='images/pinned/mid.jpg') }}" class="img-fluid map-option" onclick="changeMap(this, 'mid')">
                </div>
            </div>

            <div class="text-center">
                <div class="map-zoom-container mx-auto">
                    <div class="map-wrapper" id="mapWrapper">
                        <img id="mapImage" src="{{ url_for('static', filename='images/pinned/fleft.jpg') }}" draggable="false">
                        <div id="dropPin" class="pin"></div>
                    </div>
                </div>

                <div class="zoom-controls-bottom">
                    <button type="button" class="btn-zoom-box" onclick="adjustZoom(0.5)"><i class="fas fa-plus"></i></button>
                    <button type="button" class="btn-zoom-box" onclick="adjustZoom(-0.5)"><i class="fas fa-minus"></i></button>
                    <button type="button" class="btn-zoom-box btn-reset-box" onclick="resetZoom()">RESET</button>
                </div>
                
                <p class="small mt-3">
                    <i class="fas fa-info-circle text-cyan"></i> Klik butang zoom untuk besarkan peta, geser untuk cari liang, dan klik pada peta untuk tanda pin.
                </p>
            </div>

            <input type="hidden" id="selected_plot" name="selected_plot" value="fleft">
            <input type="hidden" id="coord_x" name="coord_x" value="">
            <input type="hidden" id="coord_y" name="coord_y" value="">
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-3">HANTAR PENDAFTARAN</button>
    </form>
</div>

<script>
    const wrapper = document.getElementById('mapWrapper');
    const img = document.getElementById('mapImage');
    const pin = document.getElementById('dropPin');
    const inputX = document.getElementById('coord_x');
    const inputY = document.getElementById('coord_y');

    let scale = 1;
    let isDragging = false;
    let startX, startY, translateX = 0, translateY = 0;
    let hasMoved = false;

    function adjustZoom(amount) {
        scale += amount;
        scale = Math.min(Math.max(1, scale), 4);
        if (scale === 1) { translateX = 0; translateY = 0; }
        updateTransform();
        wrapper.classList.toggle('can-pan', scale > 1);
    }

    function resetZoom() {
        scale = 1; translateX = 0; translateY = 0;
        updateTransform();
        wrapper.classList.remove('can-pan');
    }

    function updateTransform() {
        wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function startAction(e) {
        if (scale <= 1) return;
        isDragging = true;
        hasMoved = false;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - translateX;
        startY = clientY - translateY;
        if (!e.touches) wrapper.classList.add('panning');
    }

    function moveAction(e) {
        if (!isDragging) return;
        hasMoved = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        translateX = clientX - startX;
        translateY = clientY - startY;
        updateTransform();
    }

    function endAction() {
        isDragging = false;
        wrapper.classList.remove('panning');
    }

    wrapper.addEventListener('mousedown', startAction);
    window.addEventListener('mousemove', moveAction);
    window.addEventListener('mouseup', endAction);
    wrapper.addEventListener('touchstart', startAction, { passive: false });
    window.addEventListener('touchmove', moveAction, { passive: false });
    window.addEventListener('touchend', endAction);

    wrapper.addEventListener('click', (e) => {
        if (hasMoved) return; 
        const rect = img.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        pin.style.display = 'block';
        pin.style.left = x + '%';
        pin.style.top = y + '%';
        inputX.value = x.toFixed(2);
        inputY.value = y.toFixed(2);
    });

    function changeMap(element, plotName) {
        img.src = element.src;
        document.getElementById('selected_plot').value = plotName;
        resetZoom();
        pin.style.display = 'none';
        document.querySelectorAll('.map-option').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
    }
</script>
{% endblock %}
